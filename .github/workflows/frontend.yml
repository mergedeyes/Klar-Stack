name: Build and deploy frontend
on:
  push:
    branches: ["main"]
    paths:
      - "klar-web/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-update legal dates
        run: |
          TODAY=$(date +'%d.%m.%Y')
          UPDATED=false

          # Define the files to check
          FILES=(
            "klar-web/app/impressum/page.tsx"
            "klar-web/app/datenschutz/page.tsx"
            "klar-web/app/transparenz/page.tsx"
            "klar-web/app/nutzungsbedingungen/page.tsx"
          )

          # Get list of files changed between the previous commit and HEAD
          # Fallback gracefully if HEAD~1 doesn't exist (e.g., initial commit)
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git show --name-only --pretty="" HEAD)
          fi

          for file in "${FILES[@]}"; do
            # Check if the file exists and was modified in this push
            if [ -f "$file" ] && echo "$CHANGED_FILES" | grep -q "^$file$"; then
              echo "Updating date in $file"
              sed -i -E "s/Stand: [0-9]{2}\.[0-9]{2}\.[0-9]{4}/Stand: $TODAY/g" "$file"
              UPDATED=true
            fi
          done

          if [ "$UPDATED" = true ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add "${FILES[@]}"
            git commit -m "chore: update legal dates to $TODAY [skip ci]"
            git push
          else
            echo "No legal pages were modified."
          fi

      - name: docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v5
        with:
          context: ./klar-web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/klar-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ vars.NEXT_PUBLIC_STORAGE_URL }}
            NEXT_PUBLIC_ADMIN_USER_ID=${{ vars.NEXT_PUBLIC_ADMIN_USER_ID }}

      - name: Update container image on Magic Containers
        if: vars.APP_ID != ''
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: frontend
          image_tag: "${{ github.sha }}"
