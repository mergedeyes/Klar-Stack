name: Build and deploy frontend
on:
  push:
    branches: ["main"]
    paths:
      - "klar-web/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write
  packages: write

# A newer push to main supersedes a running deploy of the same component:
# its image would be replaced moments later anyway, and two runs racing
# could leave the older image live if it happened to finish last.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-update legal dates
        run: |
          TODAY=$(date +'%d.%m.%Y')
          UPDATED=false

          # Define the files to check
          FILES=(
            "klar-web/src/app/impressum/page.tsx"
            "klar-web/src/app/datenschutz/page.tsx"
            "klar-web/src/app/transparenz/page.tsx"
            "klar-web/src/app/nutzungsbedingungen/page.tsx"
          )

          # Diff against the push's actual starting point (github.event.before),
          # not just HEAD~1 — HEAD~1 only sees the single most recent commit, so
          # a legal-page edit earlier in a multi-commit push would be missed.
          # github.event.before is unset/zero on a repo's very first push, hence
          # the fallback to the single-commit form of `git show`.
          BEFORE_SHA="${{ github.event.before }}"
          if [ -n "$BEFORE_SHA" ] && git rev-parse --verify "$BEFORE_SHA" >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" HEAD)
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git show --name-only --pretty="" HEAD)
          fi

          for file in "${FILES[@]}"; do
            # Check if the file exists and was modified in this push
            if [ -f "$file" ] && echo "$CHANGED_FILES" | grep -q "^$file$"; then
              echo "Updating date in $file"
              sed -i -E "s/Stand: [0-9]{2}\.[0-9]{2}\.[0-9]{4}/Stand: $TODAY/g" "$file"
              UPDATED=true
            fi
          done

          # A page can already carry today's date (a second legal-page change
          # on the same day), in which case sed changes nothing and
          # `git commit` would fail the whole deploy with "nothing to commit".
          if [ "$UPDATED" = true ] && git diff --quiet -- "${FILES[@]}"; then
            echo "Legal pages already show $TODAY."
            UPDATED=false
          fi

          if [ "$UPDATED" = true ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add "${FILES[@]}"
            git commit -m "chore: update legal dates to $TODAY [skip ci]"
            git push
          else
            echo "No legal pages were modified."
          fi

      # The gha cache exporter below needs a buildx builder; the default
      # docker driver can't export caches.
      - uses: docker/setup-buildx-action@v4

      - name: docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./klar-web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/klar-frontend:${{ github.sha }}
          # Persist image layers between runs in the GitHub Actions cache so
          # unchanged steps (dependency install/compile) are skipped.
          # mode=max also caches the intermediate build stages, not just
          # the final image's layers.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ vars.NEXT_PUBLIC_STORAGE_URL }}

      - name: Update container image on Magic Containers
        if: vars.APP_ID != ''
        uses: BunnyWay/actions/container-update-image@4b22fe0b319386b3913117daf97729409dd0a6ef # main as of 2026-09-29
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: frontend
          image_tag: "${{ github.sha }}"
