name: Build and deploy frontend
on:
  push:
    branches: ["main"]
    paths:
      - "klar-web/**"
      - ".github/workflows/frontend.yml"
      # The deploy publishes legal notices with it.
      - ".github/scripts/legal_notices.py"

permissions:
  contents: read
  packages: write

# A newer push to main supersedes a running deploy of the same component:
# its image would be replaced moments later anyway, and two runs racing
# could leave the older image live if it happened to finish last.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the legal-date step reads when each page last changed.
          fetch-depth: 0

      # Stamp each legal page's "Stand" with the date its content last
      # changed on main, for this build only. Nothing is committed: pushing
      # a date commit straight to main would be rejected by the branch
      # ruleset (that commit never ran the required checks), and deriving
      # the date from history gives the same result on every deploy.
      # --first-parent makes a merged PR count on its merge date, i.e. when
      # the change went live, not when it was committed on its branch.
      - name: Stamp legal dates
        run: |
          FILES=(
            "klar-web/src/app/impressum/page.tsx"
            "klar-web/src/app/datenschutz/page.tsx"
            "klar-web/src/app/transparenz/page.tsx"
            "klar-web/src/app/nutzungsbedingungen/page.tsx"
          )

          for file in "${FILES[@]}"; do
            STAND=$(TZ=Europe/Berlin git log -1 --first-parent --date=format-local:%d.%m.%Y --format=%cd -- "$file")
            if [ -z "$STAND" ]; then
              echo "::warning::No history for $file, keeping its Stand date"
              continue
            fi
            sed -i -E "s/Stand: [0-9]{2}\.[0-9]{2}\.[0-9]{4}/Stand: $STAND/g" "$file"
            echo "$file: Stand $STAND"
          done

      # The gha cache exporter below needs a buildx builder; the default
      # docker driver can't export caches.
      - uses: docker/setup-buildx-action@v4

      - name: docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./klar-web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/klar-frontend:${{ github.sha }}
          # Persist image layers between runs in the GitHub Actions cache so
          # unchanged steps (dependency install/compile) are skipped.
          # mode=max also caches the intermediate build stages, not just
          # the final image's layers.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ vars.NEXT_PUBLIC_STORAGE_URL }}

      - name: Update container image on Magic Containers
        if: vars.APP_ID != ''
        uses: BunnyWay/actions/container-update-image@4b22fe0b319386b3913117daf97729409dd0a6ef # main as of 2026-09-29
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: frontend
          image_tag: "${{ github.sha }}"

      # Notices about changed Terms / privacy policy (klar-web/legal-updates):
      # once the live pages show this deploy's Stand date, every notice file
      # goes to the backend, which publishes each file once and ignores the
      # rest. Needs LEGAL_UPDATES_TOKEN (the same secret as in the backend
      # container) and SITE_URL (the live site, to wait for the new pages).
      - name: Publish legal notices
        if: vars.APP_ID != ''
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          LEGAL_UPDATES_TOKEN: ${{ secrets.LEGAL_UPDATES_TOKEN }}
          TZ: Europe/Berlin
        run: python3 .github/scripts/legal_notices.py publish
