name: Build and deploy db image
on:
  push:
    branches: ["main"]
    paths:
      - "deploy/postgres/**"
      - ".github/workflows/db-image.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/postgres
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/klar-db:${{ github.sha }}

      - name: Update container image on Magic Containers
        if: vars.APP_ID != ''
        uses: BunnyWay/actions/container-update-image@4b22fe0b319386b3913117daf97729409dd0a6ef # main as of 2026-09-29
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: db
          image_tag: "${{ github.sha }}"
