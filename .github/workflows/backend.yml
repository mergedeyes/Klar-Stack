name: Build and deploy backend
on:
  push:
    branches: ["main"]
    paths:
      - "Klar/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gha cache exporter below needs a buildx builder; the default
      # docker driver can't export caches.
      - uses: docker/setup-buildx-action@v3

      - name: docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Klar
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/klar-backend:${{ github.sha }}
          # Persist image layers between runs in the GitHub Actions cache so
          # unchanged steps (dependency install/compile) are skipped.
          # mode=max also caches the intermediate build stages, not just
          # the final image's layers.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Update container image on Magic Containers
        if: vars.APP_ID != ''
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: backend
          image_tag: "${{ github.sha }}"