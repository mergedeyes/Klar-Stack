name: Browser tests
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The whole stack on one runner: Postgres and Redis as services, the
# backend and the production build of the frontend as background
# processes, then Playwright (klar-web/e2e) against them. No `paths`
# filter, so the check always reports and can be required.
jobs:
  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      E2E_BASE_URL: http://localhost:3001
      E2E_API_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal
          rustup default 1.97

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            Klar/target
          key: cargo-e2e-${{ runner.os }}-1.97-${{ hashFiles('Klar/Cargo.lock') }}
          restore-keys: cargo-e2e-${{ runner.os }}-1.97-

      - name: Build backend
        working-directory: Klar
        run: cargo build --locked

      # Local file storage, email to a closed port (sends fail and are only
      # logged), no passcode gate, and a high sign-up limit for the many
      # test accounts. Migrations run on startup.
      - name: Start backend
        working-directory: Klar
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/klar
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-jwt-secret
          HOST: 127.0.0.1
          PORT: "3000"
          BASE_URL: http://localhost:3001
          CORS_ORIGINS: http://localhost:3001
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_PUBLIC_URL: http://127.0.0.1:3000
          EMAIL_PROVIDER: local
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "9"
          AUTH_RATE_LIMIT_PER_MIN: "1000"
        run: |
          nohup ./target/debug/Klar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: klar-web/package-lock.json

      - name: Install frontend
        working-directory: klar-web
        run: npm ci

      - name: Build and start frontend
        working-directory: klar-web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_STORAGE_URL: http://127.0.0.1:3000
        run: |
          npx next build
          nohup npx next start -p 3001 > frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/login && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3001/login

      - name: Install Chromium
        working-directory: klar-web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: klar-web
        run: npx playwright test

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            klar-web/playwright-report
            klar-web/test-results
            klar-web/frontend.log
            Klar/backend.log
          retention-days: 7
