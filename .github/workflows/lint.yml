name: Lint and test
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the running check obsolete.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# No `paths` filter on purpose: both jobs always report a result, so they
# can be made required status checks without a backend-only PR waiting
# forever on a skipped frontend check (or the other way round).
jobs:
  backend:
    name: Backend (clippy + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Klar
    env:
      # Queries are checked against the committed .sqlx cache; CI has no
      # database.
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      # Pinned to the Dockerfile's toolchain so a new Rust release can't
      # fail CI with freshly added clippy lints; bump both together.
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal --component clippy
          rustup default 1.97

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            Klar/target
          key: cargo-lint-${{ runner.os }}-1.97-${{ hashFiles('Klar/Cargo.lock') }}
          restore-keys: cargo-lint-${{ runner.os }}-1.97-

      # With the integration-tests feature, so the test code is linted too.
      - name: clippy
        run: cargo clippy --locked --all-targets --features integration-tests -- -D warnings

      - name: test
        run: cargo test --locked

  # API-level tests against a real Postgres and Redis (Klar/src/integration_tests/).
  integration:
    name: Backend (integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Klar
    services:
      postgres:
        # Same major as deploy/postgres.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Compile-time query checks still use the committed .sqlx cache; the
      # database is only for the tests, which create one per test.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal
          rustup default 1.97

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            Klar/target
          key: cargo-integration-${{ runner.os }}-1.97-${{ hashFiles('Klar/Cargo.lock') }}
          restore-keys: cargo-integration-${{ runner.os }}-1.97-

      - name: integration tests
        run: cargo test --locked --features integration-tests integration_tests

  frontend:
    name: Frontend (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klar-web
    steps:
      - uses: actions/checkout@v7

      # Same major as the Docker image (node:20-slim).
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: klar-web/package-lock.json

      - run: npm ci

      - name: tsc
        run: npx tsc --noEmit

      - name: eslint
        run: npx eslint src --max-warnings 0
