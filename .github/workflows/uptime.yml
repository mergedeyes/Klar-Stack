name: Uptime check
on:
  # Hourly, off the full hour: GitHub delays scheduled runs most at :00.
  # Runs can still start 10-30 minutes late, so the healthchecks.io check
  # needs a grace period that covers that (period 1h, grace 45m).
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check the live site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Its own healthchecks.io check, not the backup one: a missed backup
      # and a site that is down are different alerts.
      HEALTHCHECK_URL: ${{ secrets.UPTIME_HEALTHCHECK_URL }}
    steps:
      # The API's /health also queries the database, so "ok" means the
      # backend and Postgres are both up. The frontends are checked on
      # /welcome, the passcode page, which is reachable without the gate.
      # Each request is retried so a single dropped connection doesn't page.
      - name: Check API and frontends
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::error::UPTIME_HEALTHCHECK_URL secret is not set, nobody would be alerted"
            exit 1
          fi

          failures=""
          fetch() {
            curl -sS -m 20 --retry 2 --retry-all-errors --retry-delay 15 \
              -o /tmp/body -w "%{http_code}" "$1" 2>/tmp/err || true
          }

          code=$(fetch https://api.klarsocial.eu/health)
          if [ "$code" != "200" ] || ! grep -q '"status":"ok"' /tmp/body; then
            failures+="API /health: HTTP ${code} $(head -c 200 /tmp/body) $(cat /tmp/err)"$'\n'
          fi

          for site in https://www.klarsocial.eu https://www.klarsocial.de; do
            code=$(fetch "$site/welcome")
            if [ "$code" != "200" ]; then
              failures+="$site/welcome: HTTP ${code} $(cat /tmp/err)"$'\n'
            fi
          done

          # A /fail ping alerts at once instead of waiting out the grace
          # period. It carries no body: the privacy policy promises
          # healthchecks.io only content-free pings, so what failed is in
          # this run's log instead.
          if [ -n "$failures" ]; then
            printf '%s' "$failures"
            curl -fsS -m 10 --retry 3 -o /dev/null "${HEALTHCHECK_URL%/}/fail"
            exit 1
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"
          echo "All up"
